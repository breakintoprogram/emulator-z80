<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Speculation Emulator</title>
	<link rel="stylesheet" href="css/main.css"> 
  </head>
  <body>
    <div class="grid-container">
      <div class="header">
		<h1>Speculation Emulator</h1>
	  </div>
      <div class="emulator">
    	<canvas class="canvas" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1/>
	  </div>
      <div class="output">
		<textarea id="output" wrap="off"></textarea>
	  </div>  
      <div class="controls">
		<label for="files">Select tape:</label>
		<select name="files" id="files" class="files">
		  <optgroup label="Games">
			<option value="/games/stop_the_express.tap">Stop the Express (TAP)</option>
			<option value="/games/stop_the_express.tzx">Stop the Express (TZX)</option>
			<option value="/games/vectron.tzx" selected>Vectron (TZX)</option>
			</optgroup>
		  <optgroup label="Tests">
			<option value="/tests/z80ccf.tap">z80ccf</option>
			<option value="/tests/z80ccfscr.tap">z80ccfscr</option>
			<option value="/tests/z80doc.tap">z80doc</option>
			<option value="/tests/z80docflags.tap">z80docflags</option>
			<option value="/tests/z80flags.tap">z80flags</option>
			<option value="/tests/z80full.tap">z80full</option>
			<option value="/tests/z80memptr.tap">z80memptr</option>
		  </optgroup>
		</select>
		<button class="button" onclick="buttonOpen()">PLAY</button>
	  </div>
      <div class="footer">
	    <div>F1->F4: Set Emulator Speed</div>
	    <div>F10:    Start tape</div>
	    <div>F11:    Stop tape</div>
	    <div>F12:    Debugging mode</div>
	    <div>&nbsp;</div>
	    <div>To load, type LOAD "" then ENTER in the emulator</div>
	    <div>Select the tape from the drop-down</div>
	    <div>Then press [Play]</div>
	  </div>
    </div>
    <script type="text/javascript" src="js/main.js"></script>
    <script async type="text/javascript" src="emulator-z80.js"></script>
  </body>
</html>
