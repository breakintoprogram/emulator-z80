<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Speculation Emulator</title>
    <style>
      @font-face {
        font-family: 'zx';
         src: url('fonts/zx_spectrum-7.ttf')  format('truetype'),
      }
	  body {
        margin: 8px;
        padding: none;
        background-color: #000;
        border-width: 0px;
      }
      .container {
        display: flex;
        gap: 8px;
      }
      .container > div {
        color: #fff;
      }
	  .canvas {
		border-width: 0px;;
	  }
	  .output {
		width: 100%;
		height: 100%;
		border-width: 0px;
		background-color: #000;
		color: #fff;
		line-height: 0.5em;
		font-family: "zx";
		font-size: 2em;
	  }
	</style>
  </head>
  <body>
	<div class="container">
		<div style="width: fit-content;">
    		<canvas class="canvas" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1/>
		</div>
		<div style="width: 100%;">
			<textarea class="output" id="output" rows="8" wrap="off"></textarea>
		</div>
	</div>
    <script type='text/javascript'>
      var canvasElement = document.getElementById('canvas');
	  var outputElement = document.getElementById('output');

	  if (outputElement) outputElement.value = '';

      canvasElement.addEventListener('webglcontextlost', (e) => {
        alert('WebGL context lost. You will need to reload the page.');
        e.preventDefault();
      }, false);

      var Module = {
        print(...args) {
          console.log(...args);
		  if (outputElement) {
			var text = args.join(' ');
			outputElement.value += text + '\n';
			outputElement.scrollTop = outputElement.scrollHeight;
		  }
        },
        canvas: canvasElement,
		arguments: [
			"scale=2",
			"load=games/stop_the_express.tzx",
		],
      };
	  window.onerror = window.onunhandledrejection = () => {
		Module.print("Exception thrown: See JavaScript Console");
	  };
	  Module.print("Speculation");
	  Module.print("-----------");
	  Module.print("F1->F4: Set Emulator Speed");
	  Module.print("F10:    Start tape");
	  Module.print("F11:    Stop tape");
	  Module.print("F12:    Debugging mode");
	  Module.print("");
    </script>
    <script async type="text/javascript" src="emulator-z80.js"></script>
  </body>
</html>
